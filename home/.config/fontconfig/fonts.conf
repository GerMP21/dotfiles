<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Make the generic "monospace" font JetBrainsMono Nerd Font (ttf-jetbrains-mono-nerd),
     so terminals set to "monospace", like CachyOS's Alacritty config, get the
     Nerd Font icons the starship prompt uses. Symbols Nerd Font Mono covers any
     icon a font is missing. Check with: fc-match monospace -->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
