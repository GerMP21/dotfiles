[General]
# Image behind everything, relative to this folder or an absolute path
background=background.jpg
# Font for all text; must be installed system-wide (SDDM runs as its own user)
font=JetBrainsMono Nerd Font
# Where the login card sits, as a fraction of the screen width (0.5 = centered).
# 0.68 keeps it over the night sky, clear of the figure on the left.
cardPosition=0.68
