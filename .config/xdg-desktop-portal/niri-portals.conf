# Overrides /usr/share/xdg-desktop-portal/niri-portals.conf (from the niri
# package). Same as upstream except FileChooser: xdg-desktop-portal-gnome
# opens file dialogs with Nautilus, which isn't installed, so use the GTK
# portal instead (as the niri wiki's "Important Software" page suggests).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
