[general]
import = ["~/.config/alacritty/colors/tokyonight.toml"]
live_config_reload = true

[window]
padding = { x = 6, y = 6 }
opacity = 1.0
decorations = "None"

[font]
normal = { family = "JetBrainsMono Nerd Font" }
size = 10.5

[scrolling]
history = 10000
multiplier = 3

[cursor]
style = "Beam"

[colors]
draw_bold_text_with_bright_colors = true
